name: C++ CMake CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-and-test:
    name: Build & Run on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Debug 构建（含 sanitizer）
      - name: Configure Debug (with sanitizers)
        run: |
          cmake -S . -B build-debug \
                -DCMAKE_BUILD_TYPE=Debug \
                -DENABLE_SANITIZERS=ON

      - name: Build Debug
        run: cmake --build build-debug --config Debug -- -j 4

      - name: Run Debug binary
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./build-debug/Debug/my_app.exe
          else
            ./build-debug/my_app
          fi
        shell: bash

      # Release 构建（无 sanitizer）
      - name: Configure Release (no sanitizers)
        run: |
          cmake -S . -B build-release \
                -DCMAKE_BUILD_TYPE=Release \
                -DENABLE_SANITIZERS=ON

      - name: Build Release
        run: cmake --build build-release --config Release -- -j 4

      - name: Run Release binary
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            ./build-release/Release/my_app.exe
          else
            ./build-release/my_app
          fi
        shell: bash
