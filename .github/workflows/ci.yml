name: C++26 Modules Xmake CI

on:
  push:
    branches: [main, master]
    paths:
      - src/**
      - tests/**
      - xmake.lua
      - .github/workflows/ci.yml
  pull_request:
    paths:
      - src/**
      - tests/**
      - xmake.lua
      - .github/workflows/ci.yml
  workflow_dispatch:
    inputs:
      full_matrix:
        description: Also run macOS and Windows (uses additional hosted compute)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: true
      matrix:
        os: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.full_matrix && '["ubuntu-26.04", "macos-26", "windows-2025-vs2026"]' || '["ubuntu-26.04"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        timeout-minutes: 1

      - name: Install GCC 16
        if: runner.os == 'Linux'
        timeout-minutes: 3
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-16 g++-16

      - name: Install LLVM 22
        if: runner.os == 'macOS'
        timeout-minutes: 3
        run: brew install llvm@22

      - name: Set up Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        timeout-minutes: 3
        with:
          xmake-version: 3.1.2

      - name: Configure Debug (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 1
        run: xmake f -m debug -c --toolchain=gcc-16

      - name: Configure Debug (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 1
        run: xmake f -m debug -c --toolchain=llvm --sdk="$(brew --prefix llvm@22)"

      - name: Configure Debug (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 1
        run: xmake f -m debug -c

      - name: Build Debug
        timeout-minutes: 2
        run: xmake -vD

      - name: Test Debug
        timeout-minutes: 1
        run: xmake test -v

      - name: Configure Release
        timeout-minutes: 1
        run: xmake f -m release

      - name: Build Release
        timeout-minutes: 2
        run: xmake -vD

      - name: Test Release
        timeout-minutes: 1
        run: xmake test -v
