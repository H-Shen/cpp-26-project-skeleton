name: C++26 Modules Xmake CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 26.04 / GCC 16
            os: ubuntu-26.04
            configure_debug: xmake f -m debug -c --toolchain=gcc-16
            configure_release: xmake f -m release -c --toolchain=gcc-16
          - name: macOS 26 / LLVM Clang 21
            os: macos-26
            configure_debug: xmake f -m debug -c --toolchain=llvm --sdk="$(brew --prefix llvm@21)"
            configure_release: xmake f -m release -c --toolchain=llvm --sdk="$(brew --prefix llvm@21)"
          - name: Windows Server 2025 / Visual Studio 2026
            os: windows-2025-vs2026
            configure_debug: xmake f -m debug -c
            configure_release: xmake f -m release -c

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GCC 16
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-16 g++-16

      - name: Set up Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: 3.1.2

      - name: Install LLVM 21
        if: runner.os == 'macOS'
        run: brew install llvm@21

      - name: Print environment info
        run: xmake --version

      - name: Configure Debug
        run: ${{ matrix.configure_debug }}

      - name: Build Debug
        run: xmake -vD

      - name: Test Debug
        run: xmake test -v

      - name: Configure Release
        run: ${{ matrix.configure_release }}

      - name: Build Release
        run: xmake -vD

      - name: Test Release
        run: xmake test -v
