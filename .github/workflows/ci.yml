name: C++ CMake CI (Cross-Platform Verbose)

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-and-test:
    name: Build & Run on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    # 默认用 bash（Linux/macOS + 大部分步骤）
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print environment info
        run: |
          echo "==== System Information ===="
          echo "OS: ${{ runner.os }}"
          cmake --version
          echo
          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "MSVC cl.exe version:"
            "C:/Program Files/Microsoft Visual Studio/2022/Enterprise/VC/Tools/MSVC"/*/bin/Hostx64/x64/cl.exe 2>&1 || true
          else
            echo "Compiler version:"
            c++ --version
          fi
          echo "============================="

      # ===========================
      # Debug 构建（含 sanitizer）
      # ===========================

      - name: Configure Debug (with sanitizers, verbose)
        run: |
          cmake -S . -B build-debug \
                -DCMAKE_BUILD_TYPE=Debug \
                -DENABLE_SANITIZERS=ON \
                -DCMAKE_VERBOSE_MAKEFILE=ON

      - name: Build Debug (verbose)
        run: |
          echo "==== Building Debug (Verbose) ===="
          if [ "${{ runner.os }}" = "Windows" ]; then
            # Windows: MSBuild (cl.exe)，不能加 -j
            cmake --build build-debug --config Debug --verbose
          else
            # Linux/macOS: Make/Ninja 支持并行 + VERBOSE
            cmake --build build-debug --config Debug -- -j 4 VERBOSE=1
          fi
          echo "==================================="

      # 运行 Debug：Windows 单独用 PowerShell 跑 exe
      - name: Run Debug binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "==== Running Debug Binary (Windows) ===="
          if (Test-Path "build-debug/Debug/my_app.exe") {
            & "build-debug/Debug/my_app.exe"
          } elseif (Test-Path "build-debug/my_app.exe") {
            & "build-debug/my_app.exe"
          } else {
            Write-Error "my_app.exe not found in build-debug"
          }
          Write-Host "================================"

      - name: Run Debug binary (Unix)
        if: runner.os != 'Windows'
        run: |
          echo "==== Running Debug Binary (Unix) ===="
          ./build-debug/my_app
          echo "================================"

      # ===========================
      # Release 构建（O2，无 sanitizer）
      # ===========================

      - name: Configure Release (verbose)
        run: |
          cmake -S . -B build-release \
                -DCMAKE_BUILD_TYPE=Release \
                -DENABLE_SANITIZERS=ON \
                -DCMAKE_VERBOSE_MAKEFILE=ON

      - name: Build Release (verbose)
        run: |
          echo "==== Building Release (Verbose) ===="
          if [ "${{ runner.os }}" = "Windows" ]; then
            cmake --build build-release --config Release --verbose
          else
            cmake --build build-release --config Release -- -j 4 VERBOSE=1
          fi
          echo "===================================="

      - name: Run Release binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "==== Running Release Binary (Windows) ===="
          if (Test-Path "build-release/Release/my_app.exe") {
            & "build-release/Release/my_app.exe"
          } elseif (Test-Path "build-release/my_app.exe") {
            & "build-release/my_app.exe"
          } else {
            Write-Error "my_app.exe not found in build-release"
          }
          Write-Host "=================================="

      - name: Run Release binary (Unix)
        if: runner.os != 'Windows'
        run: |
          echo "==== Running Release Binary (Unix) ===="
          ./build-release/my_app
          echo "==================================="
