name: C++ Xmake CI (Cross-Platform)

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    name: Build & Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Print environment info
        run: xmake --version

      - name: Configure Debug
        run: xmake f -m debug -c

      - name: Build Debug
        run: xmake -vD

      - name: Test Debug
        run: xmake test -v

      - name: Configure Release
        run: xmake f -m release -c

      - name: Build Release
        run: xmake -vD

      - name: Test Release
        run: xmake test -v
