name: C++ CMake CI (Cross-Platform + FreeBSD)

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-and-test:
    name: Build & Run on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Print environment info
        run: |
          echo "==== System Information ===="
          echo "OS: ${{ runner.os }}"
          cmake --version
          echo
          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "MSVC cl.exe version:"
            cl 2>&1 || true
          else
            echo "Compiler version:"
            c++ --version
          fi
          echo "============================="

      # ===========================
      # Debug 构建（含平台特定检测）
      # ===========================
      - name: Configure Debug
        run: |
          cmake -S . -B build-debug \
                -DCMAKE_BUILD_TYPE=Debug \
                -DENABLE_SANITIZERS=ON \
                -DCMAKE_VERBOSE_MAKEFILE=ON

      - name: Build Debug
        run: |
          echo "==== Building Debug (Verbose) ===="
          if [ "${{ runner.os }}" = "Windows" ]; then
            cmake --build build-debug --config Debug --verbose
          else
            cmake --build build-debug --config Debug -- -j4 VERBOSE=1
          fi
          echo "==================================="

      - name: Run Debug binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "==== Running Debug Binary (Windows) ===="
          if (Test-Path "build-debug/Debug/my_app.exe") {
            & "build-debug/Debug/my_app.exe"
          } elseif (Test-Path "build-debug/my_app.exe") {
            & "build-debug/my_app.exe"
          } else {
            Write-Error "my_app.exe not found in build-debug"
          }
          Write-Host "================================"

      - name: Run Debug binary (Unix)
        if: runner.os != 'Windows'
        run: |
          echo "==== Running Debug Binary (Unix) ===="
          ./build-debug/my_app
          # 如果有 tsan 版本，顺带跑一下
          if [ -x "./build-debug/my_app_tsan" ]; then
            echo "==== Running Debug TSAN Binary (Unix) ===="
            ./build-debug/my_app_tsan
          fi
          echo "================================"

      # ===========================
      # Release 构建（O2，无额外 sanitizer）
      # ===========================
      - name: Configure Release
        run: |
          cmake -S . -B build-release \
                -DCMAKE_BUILD_TYPE=Release \
                -DENABLE_SANITIZERS=ON \
                -DCMAKE_VERBOSE_MAKEFILE=ON

      - name: Build Release
        run: |
          echo "==== Building Release (Verbose) ===="
          if [ "${{ runner.os }}" = "Windows" ]; then
            cmake --build build-release --config Release --verbose
          else
            cmake --build build-release --config Release -- -j4 VERBOSE=1
          fi
          echo "===================================="

      - name: Run Release binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "==== Running Release Binary (Windows) ===="
          if (Test-Path "build-release/Release/my_app.exe") {
            & "build-release/Release/my_app.exe"
          } elseif (Test-Path "build-release/my_app.exe") {
            & "build-release/my_app.exe"
          } else {
            Write-Error "my_app.exe not found in build-release"
          }
          Write-Host "=================================="

      - name: Run Release binary (Unix)
        if: runner.os != 'Windows'
        run: |
          echo "==== Running Release Binary (Unix) ===="
          ./build-release/my_app
          echo "==================================="

  # =========================================
  # FreeBSD CI：在 Ubuntu 上起 FreeBSD VM
  # =========================================
  freebsd-build-and-test:
    name: Build & Run on FreeBSD
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build & Test in FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          # 默认 14.x 就行，必要可指定版本：
          release: "14.3"
          usesh: true
          prepare: |
            pkg update -f
            pkg install -y cmake git
          run: |
            echo "==== FreeBSD version ===="
            freebsd-version

            echo "==== Configure Debug (FreeBSD) ===="
            cmake -S . -B build-debug \
                  -DCMAKE_BUILD_TYPE=Debug \
                  -DENABLE_SANITIZERS=ON
            echo "==== Build Debug (FreeBSD) ===="
            cmake --build build-debug -- -j4
            echo "==== Run Debug (FreeBSD) ===="
            ./build-debug/my_app

            echo "==== Configure Release (FreeBSD) ===="
            cmake -S . -B build-release \
                  -DCMAKE_BUILD_TYPE=Release \
                  -DENABLE_SANITIZERS=ON
            echo "==== Build Release (FreeBSD) ===="
            cmake --build build-release -- -j4
            echo "==== Run Release (FreeBSD) ===="
            ./build-release/my_app
